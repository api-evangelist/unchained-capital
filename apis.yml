aid: unchained-capital
name: Unchained Capital
description: 'Unchained (Unchained Capital, Inc.) is an Austin, Texas bitcoin-native financial
  services company built around collaborative multisig custody. Clients hold bitcoin in
  2-of-3 multisig vaults where the client holds two keys and Unchained holds one, so no
  single party — including Unchained — can move funds unilaterally, and clients can recover
  independently with open-source tooling such as Caravan and Sparrow. On top of that custody
  base Unchained offers a trading desk for buying and selling bitcoin directly to cold storage,
  bitcoin-backed loans, the Unchained IRA (Traditional, Roth, SEP and 401(k) rollovers), business
  and trust vaults, inheritance planning, and — through Gannett Trust and Gannett Wealth Advisors
  — fiduciary trust and wealth advisory services. Unchained publishes no public REST or GraphQL
  API; its public developer surface is a set of open-source bitcoin libraries (unchained-bitcoin,
  unchained-wallets, hermit, and the Caravan multisig coordinator, now maintained in the
  caravan-bitcoin organization) plus an llms.txt for AI agents.'
